# .github/workflows/pr-change-check.yml

name: 'PR: Check for File Changes'

# This workflow runs on pull requests
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check_for_changes:
    runs-on: ubuntu-latest
    steps:
      - name: 'Check for empty PR'
        # Use a dedicated action to get a list of changed files.
        # We give it an ID to reference its output in the next step.
        id: changed_files
        uses: tj-actions/changed-files@v44

      - name: 'Fail if no files were changed'
        # This step only runs if the output 'all_changed_files_count' from the previous step is '0'.
        if: steps.changed_files.outputs.all_changed_files_count == '0'
        run: |
          echo "❌ Error: This pull request has no file changes."
          exit 1

      - name: 'Success if files were changed'
        # This step will only run if the 'if' condition in the previous step was false.
        if: steps.changed_files.outputs.all_changed_files_count > '0'
        run: |
          echo "✅ Success: Pull request contains file changes."
