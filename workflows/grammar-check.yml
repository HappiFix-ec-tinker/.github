name: Grammar Check

on:
  pull_request:
    paths:
      - '**/*.md'

jobs:
  grammar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Java (required for LanguageTool)
        run: sudo apt-get update && sudo apt-get install -y default-jre

      - name: Download LanguageTool
        run: |
          curl -L -o LanguageTool.zip https://languagetool.org/download/LanguageTool-stable.zip
          unzip LanguageTool.zip

      - name: Check for grammatical errors in changed Markdown files
        run: |
          set -e
          # Get list of changed markdown files in the PR
          FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD | grep -E '\.md$' || true)
          ERRORS=0
          for FILE in $FILES; do
            echo "Checking grammar in $FILE"
            java -jar LanguageTool-*/LanguageTool.jar --language en-US "$FILE" > result.txt
            # Count grammar matches
            if grep -q '<error' result.txt; then
              echo "::warning file=$FILE::Grammar issues found in $FILE"
              ERRORS=$((ERRORS+1))
            fi
          done
          if [ "$ERRORS" -eq 0 ]; then
            echo "No grammatical errors found."
          fi
